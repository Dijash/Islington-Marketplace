{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Islington Marketplace{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  <link rel="stylesheet" href="{% static 'css/global.css' %}">
  <link rel="stylesheet" href="{% static 'css/includes/navbar.css' %}">
  <link rel="stylesheet" href="{% static 'css/includes/footer.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% include 'includes/navbar.html' %}

  <main class="main-content">
    <div class="container">
      {% block content %}{% endblock %}
      {% block extra_content %}{% endblock %}
    </div>
  </main>

  {% include 'includes/footer.html' %}

  <script src="{% static 'js/main.js' %}"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script>
    {% if messages %}
      {% for message in messages %}
        Toastify({
          text: "{{ message|escapejs }}",
          duration: 3000,
          gravity: "top",
          position: "right",
          stopOnFocus: true,
          style: {
            background: "{% if message.tags == 'success' %}#22c55e{% elif message.tags == 'error' %}#ef4444{% elif message.tags == 'warning' %}#f59e0b{% else %}#3b82f6{% endif %}",
            borderRadius: "8px",
            boxShadow: "0 4px 12px rgba(0,0,0,0.15)",
            fontWeight: "600",
            fontSize: "14px",
            padding: "12px 20px"
          }
        }).showToast();
      {% endfor %}
    {% endif %}
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
